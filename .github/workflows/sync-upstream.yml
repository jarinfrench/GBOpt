name: Sync fork main with upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'jarinfrench/GBOpt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/IdahoLabResearch/GBOpt.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fast-forwards automatically when possible; otherwise creates a
          # merge commit so fork-local commits (this workflow file, PRs
          # merged into the fork's own main, etc.) are preserved rather
          # than requiring main to be a pure upstream mirror.
          if ! git merge upstream/main --no-edit; then
            echo "::error::Merge conflict syncing with upstream/main — resolve manually."
            exit 1
          fi
          git push origin main
