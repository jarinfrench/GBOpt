# pyscn configuration — trimmed from `pyscn init`'s full template to just
# what applies to GBOpt (a library, not a layered web app).

[analysis]
recursive = true
include_patterns = ["**/*.py"]
exclude_patterns = [
    "**/test_*.py",
    "**/*_test.py",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/.pytest_cache/",
    "examples/**",
]

[complexity]
enabled = true
# Start relaxed: the baseline scan found real functions up to complexity 33.
# Ratchet this down over time instead of failing on the whole backlog at once.
max_complexity = 20

[dead_code]
enabled = true
# Only fail on genuinely unreachable code (after return/raise/break/continue),
# not every style nit, while we're still feeling this tool out.
min_severity = "critical"

[clones]
enabled = true
min_lines = 10
similarity_threshold = 0.8

[architecture]
enabled = false
